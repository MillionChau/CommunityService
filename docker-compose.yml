version: '3.8'

services:
  community-db:
    image: postgres:16-alpine
    container_name: devradar-community-db
    restart: always
    environment:
      POSTGRES_DB: community-postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - community_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community-postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  community-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devradar-community-api
    restart: always
    ports:
      - "5145:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=community-db;Port=5432;Database=community-postgres;User Id=postgres;Password=123456
      - JwtSettings__Secret=DevRadarSecretKey_SuperSecureKeyForJWTTokenGeneration_2026_SecureApp
      - JwtSettings__Issuer=DevRadarIdentityService
      - JwtSettings__Audience=DevRadarClients
    depends_on:
      community-db:
        condition: service_healthy

volumes:
  community_pgdata:
    driver: local

